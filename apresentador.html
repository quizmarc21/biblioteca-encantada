<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modo Apresentador · Biblioteca Encantada</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(#21452f,#0b2a3a) fixed;color:#f4e9c8;font:700 clamp(18px,2.2vw,26px)/1.3 'Atkinson Hyperlegible',sans-serif;display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,340px);gap:clamp(12px,2.4vw,28px);padding:clamp(12px,2.4vw,28px);padding-bottom:max(12px,env(safe-area-inset-bottom))}
h1{font:800 clamp(26px,3.4vw,40px) Cinzel,serif;color:#f2c14e;margin:0 0 6px;letter-spacing:2px}
.lv button{font:600 20px 'Atkinson Hyperlegible';margin:4px 4px 0 0;padding:6px 12px;border:3px solid #3a2410;border-radius:4px;background:#fffaf0;cursor:pointer}.lv .on{background:#f2c14e}
.pod{display:flex;align-items:flex-end;gap:14px;height:420px;margin-top:18px}
.st{flex:1;text-align:center;background:linear-gradient(#8a5a2e,#5b3a1c);border:4px solid #2a1a0c;border-radius:6px 6px 0 0;padding:8px;word-break:break-word;transition:height .6s}
.st b{display:block;font:800 40px Cinzel,serif;color:#f2c14e}
.side{background:#f4e9c8;color:#2a1a0c;border-radius:6px;padding:18px;text-align:center;align-self:start}
#qr{display:grid;place-items:center;margin:10px 0}.big{font:800 54px Cinzel,serif}
input{width:100%;font:600 16px 'Atkinson Hyperlegible';padding:6px}
@media(max-width:800px){body{grid-template-columns:1fr}.side{order:-1}.pod{height:min(46vh,300px)}.st b{font-size:24px}.big{font-size:40px}#qr canvas,#qr img{max-width:200px;height:auto}}
#bar{height:18px;background:#0b2a3a;border:3px solid #2a1a0c;border-radius:9px;overflow:hidden;margin:8px 0}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3f9b4f,#f2c14e);transition:width .6s}#tw{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#f4e9c8;color:#2a1a0c;border:4px solid #2a1a0c;border-radius:8px;padding:10px 18px;display:flex;align-items:center;gap:12px;font-size:28px;z-index:9;animation:tw 5s forwards}#tw svg{width:96px;height:96px;flex:none}.fx{overflow:visible;transform-origin:50% 50%}
.fx .hv{transform-origin:100px 100px;animation:hvr 2.6s ease-in-out infinite}
.fx .aura{transform-origin:100px 100px;animation:glw 1.8s ease-in-out infinite alternate}
.fx .wl{transform-origin:90px 100px;animation:flL .2s ease-in-out infinite alternate}.fx .wr{transform-origin:110px 100px;animation:flR .2s ease-in-out infinite alternate}
.fx .en{transform-origin:100px 100px;animation:blk 3.8s infinite}

@keyframes hvr{50%{transform:translateY(-9px)}}@keyframes glw{from{transform:scale(.88);opacity:.75}to{transform:scale(1.08);opacity:1}}
@keyframes flL{from{transform:rotate(10deg) scaleX(1)}to{transform:rotate(-16deg) scaleX(.7)}}@keyframes flR{from{transform:rotate(-10deg) scaleX(1)}to{transform:rotate(16deg) scaleX(.7)}}
@keyframes blk{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sway{from{transform:perspective(520px) rotateY(-20deg) rotateZ(-2deg)}to{transform:perspective(520px) rotateY(20deg) rotateZ(2deg)}}
.fx.talk .mc{opacity:0}.fx.talk .mo{opacity:1;transform-origin:100px 114px;animation:mth .22s ease-in-out infinite alternate}@keyframes mth{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.fx.talk .hv{animation:nod .5s ease-in-out infinite alternate}@keyframes nod{to{transform:translateY(-4px) rotate(-2deg)}}
.fx.happy .en{opacity:0}.fx.happy .eh{opacity:1}.fx.happy:not(.talk) .mc{opacity:0}.fx.happy:not(.talk) .mo{opacity:1}
.fx.sad .br{opacity:1}.fx.sad .aura{animation:none;opacity:.4}.fx.sad .hv{animation:none;transform:translateY(8px)}.fx.sad .wl,.fx.sad .wr{animation-duration:.7s}.fx.sad:not(.talk) .mc{transform:scaleY(-1);transform-origin:100px 117px}
.fx.think .hv{animation:none;transform:rotate(-8deg)}.fx.think .en{animation:none;transform:translate(4px,-4px)}
.fx.sleep .en{opacity:0}.fx.sleep .es{opacity:1}.fx.sleep .aura{animation-duration:3.5s}.fx.sleep .wl,.fx.sleep .wr{animation-duration:1s}
.fx.jump{animation:jmp .85s cubic-bezier(.3,.7,.4,1)}@keyframes jmp{0%{transform:scale(1.1,.88)}30%{transform:translateY(-46px) scale(.95,1.08)}60%{transform:translateY(0) scale(1.1,.88)}100%{transform:none}}
.fx.flip{animation:flp 1.2s cubic-bezier(.3,.7,.4,1)}@keyframes flp{0%{transform:scale(1.1,.88)}25%{transform:translateY(-56px) rotate(-120deg)}50%{transform:translateY(-80px) rotate(-250deg)}80%{transform:translateY(-10px) rotate(-350deg)}100%{transform:translateY(0) rotate(-360deg)}}
@keyframes tw{0%{opacity:0;top:-80px}10%,85%{opacity:1;top:24px}100%{opacity:0}}#last{font-size:20px;opacity:.9}button{font:700 18px 'Atkinson Hyperlegible';padding:6px 12px;border:3px solid #2a1a0c;border-radius:4px;background:#f2c14e;cursor:pointer}</style></head><body>
<main><h1>Biblioteca Encantada</h1><div class="lv" id="lvs"></div><div class="pod" id="pod"></div><div id="bar"><i></i></div><p id="prg"></p><p id="lst"></p><p id="last"></p><button id="fs">Tela cheia</button></main>
<aside class="side"><div>Aponte a câmera e entre na biblioteca</div><div id="qr"></div><input id="url" aria-label="Endereço do site"><hr><div class="big" id="ent">0</div>entraram<div class="big" id="ter">0</div>terminaram</aside>
<script>
var DB="https://quiz-marc-default-rtdb.firebaseio.com",NAMES=["Básico","Intermediário","Difícil","Expert","Lendário"],L=0,$=function(i){return document.getElementById(i)};
NAMES.forEach(function(n,i){var b=document.createElement("button");b.textContent=n;b.className=i?"":"on";b.onclick=function(){L=i;[].forEach.call($("lvs").children,function(x,k){x.className=k===i?"on":""});draw()};$("lvs").appendChild(b)});
var R={},J={};function g(p){return fetch(DB+p+".json").then(function(r){return r.json()})}
function poll(){Promise.all([g("/ranking"),g("/joins")]).then(function(a){R=a[0]||{};J=a[1]||{};draw()}).catch(function(){$("lst").textContent="Sem conexão com o Firebase."})}
function draw(){var o=R["L"+L]||{},a=Object.keys(o).map(function(k){return o[k]}).sort(function(x,y){return y.s-x.s||x.t-y.t}),t=[a[1],a[0],a[2]],h=[300,420,230],lb=["2º","1º","3º"];
 $("pod").innerHTML=t.map(function(x,k){return'<div class="st" style="height:'+h[k]+'px"><b>'+lb[k]+"</b>"+(x?x.n.replace(/[<>&]/g,"")+"<br>"+x.s:"—")+"</div>"}).join("");
 var j=J["L"+L]||{};var ne=Object.keys(j).length;$("ent").textContent=ne;$("ter").textContent=a.length;$("bar").firstChild.style.width=(ne?Math.min(100,a.length/ne*100):0)+"%";$("prg").textContent=a.length+" de "+ne+" aventureiros concluíram";var top3=a.slice(0,3).map(function(x){return x.n});if(PREV){top3.forEach(function(n){if(PREV.indexOf(n)<0)cheer(n)})}PREV=top3;$("last").textContent="Últimos a terminar: "+a.slice().sort(function(x,y){return y.ts-x.ts}).slice(0,8).map(function(x){return x.n}).join(" · ");$("lst").textContent=a.slice(3,8).map(function(x,i){return(i+4)+"º "+x.n+" ("+x.s+")"}).join("  ·  ")}
var PREV=null;
function foxSVG(st){var V='stroke="#fff" stroke-opacity=".75" stroke-width="1.6"';
 return'<svg viewBox="0 0 200 200" class="fx" aria-label="Fadinha, a mascote da biblioteca"><defs><radialGradient id="fa" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8fdff" stop-opacity=".95"/><stop offset=".38" stop-color="#8fe9ff" stop-opacity=".5"/><stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/></radialGradient><radialGradient id="fb" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#c8f6ff"/><stop offset=".62" stop-color="#5fd0f5"/><stop offset="1" stop-color="#1b74c4"/></radialGradient><linearGradient id="fw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#bdf1ff" stop-opacity=".6"/><stop offset="1" stop-color="#8f9bff" stop-opacity=".45"/></linearGradient></defs>'+
 '<g class="hv"><circle class="aura" cx="100" cy="100" r="94" fill="url(#fa)"/>'+
 '<g class="wl"><path d="M88,94 C62,40 12,16 8,44 C6,72 54,98 88,100Z" fill="url(#fw)" '+V+'/><path d="M88,106 C62,112 26,140 38,162 C58,172 84,134 90,110Z" fill="url(#fw)" '+V+'/><path d="M86,96 C60,72 32,52 14,46 M88,98 C64,86 40,78 18,66" '+V+' fill="none" opacity=".7"/></g>'+
 '<g class="wr"><path d="M112,94 C138,40 188,16 192,44 C194,72 146,98 112,100Z" fill="url(#fw)" '+V+'/><path d="M112,106 C138,112 174,140 162,162 C142,172 116,134 110,110Z" fill="url(#fw)" '+V+'/><path d="M114,96 C140,72 168,52 186,46 M112,98 C136,86 160,78 182,66" '+V+' fill="none" opacity=".7"/></g>'+
 '<circle cx="100" cy="100" r="35" fill="url(#fb)"/><circle cx="100" cy="100" r="35" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2"/><ellipse cx="86" cy="82" rx="13" ry="7" fill="#fff" opacity=".85" transform="rotate(-32 86 82)"/>'+
 '<path d="M100,52 l4,9 9,4 -9,4 -4,9 -4,-9 -9,-4 9,-4z" fill="#fff"/>'+
 '<ellipse cx="78" cy="113" rx="6" ry="3.5" fill="#ff9fb8" opacity=".55"/><ellipse cx="122" cy="113" rx="6" ry="3.5" fill="#ff9fb8" opacity=".55"/>'+
 '<g class="en"><ellipse cx="88" cy="100" rx="5.5" ry="8" fill="#0b3a66"/><ellipse cx="112" cy="100" rx="5.5" ry="8" fill="#0b3a66"/><circle cx="90" cy="97" r="2.2" fill="#fff"/><circle cx="114" cy="97" r="2.2" fill="#fff"/></g>'+
 '<g class="eh" opacity="0" fill="none" stroke="#0b3a66" stroke-width="3.5" stroke-linecap="round"><path d="M81,103 Q88,92 95,103"/><path d="M105,103 Q112,92 119,103"/></g>'+
 '<g class="es" opacity="0" stroke="#0b3a66" stroke-width="3.5" stroke-linecap="round"><path d="M82,103 L94,103"/><path d="M106,103 L118,103"/></g>'+
 '<g class="br" opacity="0" stroke="#0b3a66" stroke-width="3" stroke-linecap="round"><path d="M80,90 L95,86"/><path d="M120,90 L105,86"/></g>'+
 '<path class="mc" d="M92,115 Q100,123 108,115" stroke="#0b3a66" stroke-width="3" fill="none" stroke-linecap="round"/>'+
 '<g class="mo" opacity="0"><path d="M92,114 Q100,133 108,114Z" fill="#7a1d3a" stroke="#0b3a66" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="100" cy="125" rx="5" ry="3" fill="#ff7a9a"/></g></g></svg>'}
function fox(){return foxSVG()}
function cheer(n){var d=document.createElement("div");d.id="tw";d.innerHTML=fox()+"<span></span>";d.firstChild.setAttribute("class","fx flip happy talk");d.lastChild.textContent=n+" entrou no pódio!";document.body.appendChild(d);setTimeout(function(){d.remove()},5200)}
$("fs").onclick=function(){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
$("url").value=location.href.replace(/apresentador\.html.*$/,"");
function qr(){$("qr").innerHTML="";if(typeof QRCode==="undefined"){$("qr").textContent="QR indisponível (sem internet?)";return}new QRCode($("qr"),{text:$("url").value,width:240,height:240,colorDark:"#2a1a0c",colorLight:"#f4e9c8",correctLevel:QRCode.CorrectLevel.H})}
$("url").onchange=qr;qr();poll();setInterval(poll,4000);
</script></body></html>
